# 코드 생성기(build_runner)에게 주는 설정 파일입니다.
#
# 이 파일을 고친 뒤에는 코드 생성을 다시 돌려야 반영됩니다.
#   dart run build_runner build

targets:
  $default:
    builders:
      drift_dev:
        options:
          # 날짜/시각을 ISO 8601 글자(예: "2026-08-25T02:30:00.000Z")로 저장합니다.
          #
          # 왜 이 설정이 필요한가:
          # drift는 기본적으로 시각을 "1970년부터 몇 초 지났는지"라는 정수로 저장하고,
          # 읽을 때는 **현지 시각**으로 돌려줍니다. 그러면 UTC로 저장한 값이
          # 읽을 때 한국 시각(+9시간)으로 바뀌어서, "UTC로 저장한다"는 설계 원칙이
          # 조용히 깨집니다. 시차가 다른 기기끼리 데이터를 합칠 때 순서가 뒤집힙니다.
          #
          # 글자로 저장하면 시간대 정보(끝의 Z)가 함께 남아서 UTC가 그대로 유지되고,
          # 밀리초 단위 정밀도도 보존됩니다.
          #
          # 주의: 이 설정은 **저장 형식 자체를 바꿉니다.** 이미 저장된 데이터가 있는
          # 상태에서 바꾸면 기존 값을 못 읽습니다. 아직 사용자 데이터가 없는
          # 지금(schemaVersion 1) 정한 것입니다. 나중에는 바꾸지 마세요.
          store_date_time_values_as_text: true
